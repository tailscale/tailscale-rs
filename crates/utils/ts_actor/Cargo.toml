[package]
name = "ts_actor"
version.workspace = true
description = "tailscale actor system"
categories = ["no-std"]
keywords = ["tailscale", "actor"]

repository.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
smallbox = { version = "0.8", default-features = false }
smol_str = { version = "0.3", default-features = false }
atomic-waker = { version = "1.1" }
lock_api = { version = "0.4", features = ["arc_lock", "atomic_usize"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[features]
default = []

[lints]
workspace = true
